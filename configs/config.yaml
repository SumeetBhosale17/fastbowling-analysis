app:
  log_level: INFO
  experiment_name: fast_bowling_analysis

data:
  video_dir: data/raw_videos
  output_dir: data/processed
  formats: [mp4, avi, mov]

video:
  frame_stride: 1
  start_timestamp_ms: 0
  max_input_height: 1080
  min_fps_warn: 60
  min_fps_reject: 30
  min_bowler_frame_fraction_warn: 0.40
  min_bowler_frame_fraction_reject: 0.20
  min_aspect_ratio: 1.0
  max_background_pan_px_per_frame: 5.0

pose:
  model:
    path: models/pose_landmarker_full.task
    num_poses: 1
    confidences:
      detection: 0.6
      presence: 0.6
      tracking: 0.6

  qa:
    max_no_pose_ratio: 0.7
    max_pose_gap: 60

motion:
  visibility_threshold: 0.5 # landmarks below this confidence treated as missing.
  max_interpolation_gap: 5 # interior NaN runs <= this many frames are bridged
  smoothing:
    window: 7 # Savitzky-Golay window (odd, > polyorder)
    polyorder: 3

events:
  # Which arm bowled. Angular sweep of the wrist about its own shoulder over
  # the delivery separates the arms decisively - the bowling arm circumducts
  # through more than a full turn while the front arm swings through about
  # half. Vertical range and apex height do NOT work: on the reference clip
  # both pick the front arm.
  bowling_arm:
    min_angular_sweep_deg: 270.0

  # Foot contact: ankle at a local lowest point with vertical speed near zero.
  # Speed is in normalized units per second - an airborne ankle runs 0.3-0.5,
  # a planted one under 0.05.
  foot_contact:
    max_vertical_speed: 0.15
    min_stationary_frames: 3
    min_separation_frames: 5 # closer plants are one contact, not two

  # Release: the bowling arm continues past vertical before the ball leaves,
  # so the wrist apex is systematically early - 2 frames on the reference
  # clip. Detecting a fixed angle past vertical instead removes that bias and,
  # unlike a frame offset, does not change meaning with frame rate. Sign of
  # the sweep depends on which way the bowler faces; the detector normalises
  # it, this threshold is a magnitude.
  #
  # 11 degrees is the centre of the 8-14 degree band that all resolve to the
  # labelled release frame on the one clip we have. Revisit once there are
  # more - a single clip cannot pin this down.
  release:
    degrees_past_vertical: 11.0
    max_frames_after_ffc: 60

  # Arm deceleration complete: bowling wrist reaches its lowest point as the
  # downswing ends.
  arm_deceleration:
    max_frames_after_release: 60

  # Follow-through: whole-body motion settles once the action is over.
  # UNVALIDATED - the reference clip cuts before this event, so these are
  # starting points, not measured thresholds.
  follow_through:
    max_frames_after_arm_deceleration: 150
    max_com_speed_fraction: 0.15
    min_sustained_frames: 5